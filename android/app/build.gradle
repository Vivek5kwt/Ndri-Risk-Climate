plugins {
    id "com.android.application"
    // FlutterFire - Google services
    id "com.google.gms.google-services"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load keystore credentials from android/key.properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.lifecycle("Warning: key.properties not found; release signing will fail if you try to upload.")
}

android {
    namespace = "com.ndri.dairyrisk"
    compileSdk = 36
    // if you use native code, keep this:
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "com.ndri.dairyrisk"
        // Firebase Auth's native SDK requires API 23. Keep API 23 devices
        // supported rather than silently inheriting Flutter's API 24 default.
        minSdkVersion = flutter.minSdkVersion
        targetSdk     = 36
        versionCode   = flutter.versionCode
        versionName   = flutter.versionName

    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin → JVM17
    kotlinOptions {
        jvmTarget = "17"
    }

    // ✅ Real release signing config (reads from key.properties)
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            // picks up manifestPlaceholders from defaultConfig
        }
        release {
            // ✅ Use the real release keystore, NOT debug
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            // Optional: keep as needed
            minifyEnabled false
            shrinkResources false
            debuggable false
            // also picks up manifestPlaceholders from defaultConfig
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
