plugins {
    id "com.android.application"
    // FlutterFire - Google services
    id "com.google.gms.google-services"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load keystore credentials from android/key.properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.lifecycle("Warning: key.properties not found; release signing will fail if you try to upload.")
}

android {
    namespace = "com.ndri.dairyrisk"
    compileSdk = 35
    // if you use native code, keep this:
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId = "com.ndri.dairyrisk"
        minSdk        = flutter.minSdkVersion
        targetSdk     = flutter.targetSdkVersion
        versionCode   = flutter.versionCode
        versionName   = flutter.versionName

        // This tells the manifest merger to replace android:name="${applicationName}"
        manifestPlaceholders = [
                applicationName: "com.ndri.dairyrisk.App"
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Kotlin → JVM17
    kotlinOptions {
        jvmTarget = "17"
    }

    // ✅ Real release signing config (reads from key.properties)
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            // picks up manifestPlaceholders from defaultConfig
        }
        release {
            // ✅ Use the real release keystore, NOT debug
            signingConfig signingConfigs.release
            // Optional: keep as needed
            minifyEnabled false
            shrinkResources false
            debuggable false
            // also picks up manifestPlaceholders from defaultConfig
        }
    }
}

flutter {
    source = "../.."
}
